name: Release

# Builds phpstan-diff.phar and phpstan-diff-filter.phar, tests them, and, for a
# pushed version tag, attaches them to a draft of that tag's GitHub release, for
# the maintainer to edit the notes of and publish (with immutable releases turned
# on, files can't be added to a published release, and subscribers are notified
# with the notes it's published with). Run it by hand (on any branch or tag) to
# just build and test them; the PHARs are then kept as a workflow artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PHARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest PHP supported, so that the PHARs are tested on it.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none

      # For a tag, the PHARs report its version; else, what `git describe` says.
      - name: Build
        run: tools/build-phar build
        env:
          PHPSTAN_DIFF_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Check the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "$(build/phpstan-diff.phar --version)" = "phpstan-diff ${TAG#v}" ]
          [ "$(build/phpstan-diff-filter.phar --version)" = "phpstan-diff-filter ${TAG#v}" ]

      - name: Test the PHARs
        run: tests/run-tests.sh
        env:
          PHPSTAN_DIFF: ${{ github.workspace }}/build/phpstan-diff.phar
          PHPSTAN_DIFF_FILTER: ${{ github.workspace }}/build/phpstan-diff-filter.phar

      - name: Write checksums
        working-directory: build
        run: sha256sum -- *.phar > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phars
          path: build/
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    # Only for a pushed tag: a manual run, even on a tag, mustn't replace a
    # published release's PHARs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create the release and upload its assets.
      id-token: write # For the build provenance attestation.
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phars
          path: build

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.phar

      # A draft left by an earlier run is reused. A release that's already
      # published can't take the files if it's immutable, so then the upload
      # fails.
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" build/*.phar build/SHA256SUMS --clobber
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Draft release ready to publish: $url" >> "$GITHUB_STEP_SUMMARY"
